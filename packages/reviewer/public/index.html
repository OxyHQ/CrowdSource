<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CrowdSource" />
    <meta name="application-name" content="CrowdSource" />

    <!--
      Brand marks. These live here rather than in `app.config.js` because the
      Metro web export reads neither `web.meta` nor `web.manifest`, and because a
      user-defined `public/favicon.ico` makes Expo skip its own `<link
      rel="icon">` injection. `sizes="any"` tells the browser the .ico carries
      more than one resolution (16 and 32) and to pick per display density.
      The manifest supplies the installable-app icons, including the maskable
      pair Android shapes to the launcher silhouette.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!--
      Reviewer surfaces must not be indexed or previewed: a case URL is issued to
      one reviewer for a limited time, and there is no public case browser.
    -->
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Resource hints for the two cross-origin hosts the first screen hits before
      any JS-driven fetch can resolve DNS/TLS on its own:
        - the CrowdSource API
        - the Oxy identity API (session cold boot)
      `preconnect` warms DNS + TCP + TLS; `dns-prefetch` is the wider-supported
      fallback. Both hosts are hit by bearer (no-cookie) requests, so
      `crossorigin` matches the connection the browser actually reuses.

      These mirror the PRODUCTION values of `API_URL` / `OXY_BASE_URL` in
      `config.ts`. This shell is only used by the production web export
      (web.output: "single"), which always targets these hosts. Keep in sync with
      config.ts if the production API hosts ever change.
    -->
    <link rel="preconnect" href="https://api.crowdsource.oxy.so" crossorigin />
    <link rel="preconnect" href="https://api.oxy.so" crossorigin />
    <link rel="dns-prefetch" href="https://api.crowdsource.oxy.so" />
    <link rel="dns-prefetch" href="https://api.oxy.so" />

    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for the Expo app. -->
    <div id="root"></div>
  </body>
</html>
