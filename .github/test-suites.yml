# The CI test suites, one entry per matrix job of `ci.yml`'s `tests` job.
#
# A data file rather than a literal `matrix.include`, because a literal one
# cannot shrink. GitHub applies `exclude` BEFORE `include`, and an `include`
# entry that matches no remaining combination is added back as a new one, so
# a pull request that excluded a suite ran it anyway. Measured on probe PR
# #215 (run 36734173598): `changes` excluded eight of nine suites and all nine
# ran. The `changes` job reads this file, drops the suites a pull request does
# not touch and hands the rest to the matrix; `validate-workflows.mjs` reads
# it for the package census and the test-floor checks.
suites:
  - package: backend
    command: bun run --cwd packages/backend test:coverage -- --coverage.reportsDirectory="$RUNNER_TEMP/backend-coverage"
    coverage: true
    # The tenant-isolation tests run against a REAL Postgres, and there is
    # no version of them that does not. Row-level security is a property of
    # the server: a mock cannot answer whether `FORCE` is set, whether a
    # superuser bypasses a policy, or whether `SET LOCAL` reverts at commit
    # — and each of those was measured, not assumed.
    #
    # It matters more here than for `app`, because the failure mode is
    # RETURNING ROWS rather than erroring. A suite that silently stopped
    # running these would be green, and production cannot contradict it:
    # the database holds two documents and neither carries a tenant pair.
    # `vitest.globalSetup.ts` therefore THROWS without the URL rather than
    # skipping, so a job that forgot this flag fails loudly.
    postgres: true
  - package: reviewer
    command: bun run --cwd packages/reviewer test:coverage -- --coverageDirectory="$RUNNER_TEMP/reviewer-coverage" --json --outputFile="$RUNNER_TEMP/reviewer-tests.json"
    coverage: true
    # `coverage: true` buys REPORTING, not enforcement. This package's
    # jest config (the `jest` key in its package.json) sets
    # `collectCoverageFrom` and `coverageReporters` and NO
    # `coverageThreshold`, and there is no jest.config.* in the package
    # or at the repo root — so `--coverage` collects the numbers, prints
    # them, and can never fail on them. `backend` is the opposite case
    # and needs no entry here: its vitest.config.ts carries enforcing
    # thresholds (97/92/96/98), so a suite that ran nothing scores 0%
    # and fails already.
    #
    # Measured 2026-08-11 on a green run: 139 tests across 13 suites.
    # RETIREMENT CONDITION, stated here rather than in a pull request
    # nobody reads twice: raise this as the suite grows, and lower it
    # ONLY in the same change that deletes the tests, naming them. A
    # floor edited to match whatever ran is not a floor.
    minimum_tests: 139
  # The TWO published packages, across the five suites they carry. Every
  # Oxy app is about to depend on them, so an untested change here breaks
  # adopters rather than us. The floor is a minimum, not a target: a suite
  # that runs nothing exits 0, and without a stated count that job reads as
  # coverage forever.
  #
  # Sized to catch a COLLAPSE, not a single deleted test. One deletion is a
  # deliberate act a reviewer sees; a traversal breaking to near-zero is the
  # invisible failure. So these sit a few tests below current, and they move
  # DOWN when a suite legitimately shrinks — 0.3.0 removed the Uploads tests
  # and left the client at 77, which had quietly narrowed its old floor of
  # 75 to two tests of slack.
  #
  # `core`, `core-express`, `core-outbox` and `core-testing` are four
  # SUITES of ONE package (`packages/core`), one per published entry
  # point, each with its own vitest config. A single entry running all
  # four would need a single floor over the union, and a floor over a
  # union cannot say which half collapsed — which is the only thing these
  # numbers are for. `validate-workflows.mjs` requires a matrix entry
  # NAMED for every package directory with a test script, which the
  # `core` entry is.
  - package: contracts
    command: bun run --cwd packages/contracts test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/contracts-tests.json"
    # Raised with the appeals contracts (§9.8): the suite runs 201, and a
    # floor of 170 would let all 25 of those tests be deleted with the job
    # still green — which is the erosion this gate exists to catch.
    minimum_tests: 195
  # The root entry point: the API client a consumer gets from
  # `@crowdsource.you/core` itself.
  - package: core
    label: packages/core (the root entry point)
    command: bun run --cwd packages/core test:unit -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/core-tests.json"
    minimum_tests: 73
  - package: core-express
    label: packages/core (the ./express entry point)
    command: bun run --cwd packages/core test:express -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/core-express-tests.json"
    minimum_tests: 47
  - package: core-testing
    label: packages/core (the ./testing entry point)
    command: bun run --cwd packages/core test:testing -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/core-testing-tests.json"
    minimum_tests: 12
  # `test:outbox` rather than the package's own `test`, because that script
  # chains all four suites plus the invariant mutation run, and the reporter
  # flags below would land on the chain instead of on vitest. The other two
  # halves still run here: the mutation script is what proves the two
  # invariant tests can fail at all, so a job that skipped it would gate
  # nothing that matters, and `test:table-type` is listed explicitly for the
  # same reason — a gate chained into a script CI does not call is a gate
  # that never runs, and an absent check is indistinguishable from a passing
  # one.
  - package: core-outbox
    label: packages/core (the ./outbox entry point)
    command: bun run --cwd packages/core test:outbox -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/core-outbox-tests.json" && bun run --cwd packages/core test:invariants && bun run --cwd packages/core test:table-type
    # The PostgreSQL-only suite runs 140 tests. This floor is sized to
    # catch a traversal/backend collapse rather than turn one reviewed
    # test deletion into an unrelated CI edit, and it moves UP with the
    # suite: a floor left where it was is a floor that stops meaning
    # anything the moment a file is added.
    minimum_tests: 136
    # The schema and store tests run against a REAL Postgres: a fake
    # cannot answer a `pg_index` query, and the questions that matter here
    # (is the swept column indexed, does the composite primary key exist,
    # does SKIP LOCKED skip) are catalogue and concurrency questions.
    #
    # Started from the SAME compose file a developer uses, deliberately,
    # rather than from a `services:` block. A `services:` block is
    # job-level and cannot be conditional on a matrix value, so it would
    # start a container for every entry including the two frontends —
    # and it would restate the image pin, giving CI and a developer two
    # places to disagree about the version under test.
    postgres: true
  # The console has no coverage threshold of its own yet, so it runs the plain
  # suite: a `coverage: true` entry whose package publishes no summary would fail
  # the upload step below with `if-no-files-found: error`, which is a CI failure
  # about an artifact rather than about the code.
  - package: console
    command: bun run --cwd packages/console test -- --json --outputFile="$RUNNER_TEMP/console-tests.json"
    coverage: false
    # The only matrix entry with NO floor of any kind before this: no
    # `minimum_tests`, and `coverage: false` so there is not even a
    # percentage to fall through. A jest-expo preset failure, a
    # moduleNameMapper that stops resolving, or a glob that matches
    # nothing exits 0 and the job is green.
    #
    # Measured 2026-08-11 on a green run: 118 tests across 14 suites.
    # RETIREMENT CONDITION: raise it as the suite grows; lower it ONLY in
    # the same change that deletes the tests, naming them.
    minimum_tests: 118
