# Dependabot configuration for the CrowdSource monorepo.
#
# This repo uses Bun (`bun.lock`) with workspaces, so the ecosystem is `bun`:
# Dependabot's `npm` ecosystem refuses a repo whose only lockfile is `bun.lock`
# (it cannot update it), and the `bun` one regenerates `bun.lock` in the PR.
#
# ONE pull request per ecosystem per week:
#   * every update (majors included) lands in the single `all` group, and
#   * `directories:` (plural) makes the root and every package one PR, not one
#     per directory.
# Expo, React and the native toolchain remain manually coordinated (`ignore`).
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Bun workspaces — root + every package.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "bun"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # One group for EVERY update, majors included: one PR per week.
    groups:
      all:
        patterns:
          - "*"
    # MANUALLY managed — do NOT let Dependabot touch the pinned toolchains.
    ignore:
      # Expo SDK + toolchain — locked to the Expo SDK 56 release train.
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      # React / React Native core — version-locked via root `overrides`.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-web"
      # Metro / RN build + animation stack — must move in lockstep with Expo.
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-worklets-core"
      - dependency-name: "nativewind"
      - dependency-name: "tailwindcss"
      - dependency-name: "@tailwindcss/*"
      - dependency-name: "lightningcss"
      - dependency-name: "lightningcss-*"
      # AI SDK — intentionally pinned (breaking changes between minors).
      - dependency-name: "ai"

  # ---------------------------------------------------------------------------
  # GitHub Actions — keep workflow action versions current.
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci(deps)"
    groups:
      all:
        patterns:
          - "*"
