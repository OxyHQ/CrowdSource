name: Deploy Frontends

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-crowdsource-frontend
  cancel-in-progress: false

env:
  BUN_VERSION: '1.3.14'
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  scope:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff runs from the `deployed/frontend` marker to the
          # candidate, so this job needs the marker tags and the history that
          # connects them to the candidate.
          fetch-depth: 0
          fetch-tags: true
      - name: Detect frontend deployment scope
        id: filter
        run: bash .github/scripts/deployment-scope.sh frontend

  deploy-frontend:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build shared contracts package
        run: bun run build:contracts

      - name: Build reviewer
        run: bun run build:reviewer
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.crowdsource.oxy.so
          # CrowdSource's registered Oxy application. A public routing
          # identifier, not a credential — it is baked into a static bundle and
          # is meaningless without the account holder completing sign-in — so it
          # belongs here rather than in a secret.
          EXPO_PUBLIC_OXY_CLIENT_ID: oxy_dk_2a44549e571029e1c1de32a2e9b6e08cf45393fce5e96133

      - name: Validate static hosting contract
        run: bun .github/scripts/validate-frontend-static-output.mjs packages/reviewer/dist

      - name: Verify current main before production changes
        run: bash .github/scripts/require-current-main.sh

      # `wrangler pages deploy` publishes into a project and cannot create one,
      # so without this the very first push to a new repository fails with
      # nothing to deploy into. Idempotent, so run N is a single GET.
      - name: Ensure the Cloudflare Pages project exists
        id: project
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT_NAME: crowdsource-frontend
          PAGES_PRODUCTION_BRANCH: main
        run: bash .github/scripts/cloudflare-pages.sh ensure-project

      - name: Capture the current production deployment
        id: previous
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT_NAME: crowdsource-frontend
        run: bash .github/scripts/cloudflare-pages.sh capture-production

      - name: Deploy an immutable Cloudflare Pages preview
        id: preview
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: '4.81.0'
          command: pages deploy packages/reviewer/dist --project-name=crowdsource-frontend --branch=candidate-${{ env.DEPLOY_SHA }}

      # A Pages project that has never released has no certificate for its
      # *.pages.dev names yet, so the first deployment can fail the TLS
      # handshake for a few minutes. The gate is a FACT, not an error shape:
      # `has_previous` is false only until a production deployment has ever
      # succeeded, so once one has, this step never runs again and the same
      # handshake failure stays immediately fatal in the smoke below — where it
      # means a broken certificate rather than an unissued one.
      - name: Wait for the first certificate on a project that has never released
        if: steps.previous.outputs.has_previous == 'false'
        env:
          PREVIEW_ORIGIN: ${{ steps.preview.outputs.deployment-url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            # Any HTTP response means the handshake completed, which is all this
            # step is waiting for; the smoke that follows judges the content.
            if curl --silent --output /dev/null --max-time 15 "$PREVIEW_ORIGIN/"; then
              echo "TLS is serving after ${attempt} attempt(s)."
              exit 0
            fi
            echo "::notice::No certificate yet for the new project; retrying in 15s (${attempt}/20)."
            sleep 15
          done
          echo "::error::TLS did not come up within 5 minutes on a newly created Pages project."
          exit 1

      - name: Smoke test the exact preview deployment
        env:
          WEB_ORIGIN: ${{ steps.preview.outputs.deployment-url }}
        run: bash .github/scripts/smoke-frontend.sh

      - name: Re-verify current main before production promotion
        run: bash .github/scripts/require-current-main.sh

      - name: Promote the validated assets to Cloudflare Pages production
        id: production
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun
          wranglerVersion: '4.81.0'
          command: pages deploy packages/reviewer/dist --project-name=crowdsource-frontend --branch=main

      - name: Smoke test the exact production deployment
        id: production_smoke
        env:
          DEPLOYMENT_ORIGIN: ${{ steps.production.outputs.deployment-url }}
        run: WEB_ORIGIN="$DEPLOYMENT_ORIGIN" bash .github/scripts/smoke-frontend.sh

      # Runs after the production smoke so the public hostname is only ever
      # pointed at a release whose assets have already been verified. Idempotent,
      # and self-healing if the domain is ever detached by hand.
      - name: Attach the public custom domain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT_NAME: crowdsource-frontend
          PAGES_CUSTOM_DOMAIN: crowdsource.oxy.so
        run: bash .github/scripts/cloudflare-pages.sh attach-domain

      # Attaching the domain is only half of it: Cloudflare does not write the
      # DNS record, so without this the attachment stays `pending` forever,
      # waiting on a record nothing is going to create. Refuses to touch a
      # record it did not write — this zone carries the ecosystem's production
      # DNS.
      - name: Ensure the public DNS record
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT_NAME: crowdsource-frontend
          PAGES_CUSTOM_DOMAIN: crowdsource.oxy.so
          PAGES_DNS_ZONE: oxy.so
        run: bash .github/scripts/cloudflare-pages.sh ensure-dns-record

      - name: Roll back Cloudflare Pages after a failed production smoke
        if: >-
          failure() &&
          steps.production.outcome == 'success' &&
          steps.production_smoke.outcome == 'failure' &&
          steps.previous.outputs.has_previous == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIOUS_DEPLOYMENT_ID: ${{ steps.previous.outputs.deployment_id }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/crowdsource-frontend/deployments/$PREVIOUS_DEPLOYMENT_ID/rollback" \
            >/dev/null
          echo "::warning::Cloudflare Pages rolled back to $PREVIOUS_DEPLOYMENT_ID."

  record-deployment:
    # Runs only after a green production rollout, so a failed or rolled back
    # release stays inside the next candidate's scope diff.
    needs: deploy-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this workflow that may move the marker; the build job
    # keeps a read-only token.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Record the deployed frontend revision
        run: bash .github/scripts/record-deployment.sh frontend
