name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PULL REQUESTS CANCEL; MAIN NEVER DOES, and the second half is a deploy
  # invariant rather than a CI preference.
  #
  # `deploy-aws.yml` and `deploy-frontends.yml` both trigger on
  # `workflow_run … types: [completed]` and gate on
  # `workflow_run.conclusion == 'success'`. `completed` fires on ANY completion,
  # cancellation included — so a cancelled CI run starts the deploy workflow,
  # fails its scope job, and the run reports `skipped`. That is the same word a
  # legitimately path-filtered deploy uses, and nothing anywhere is red.
  #
  # With `cancel-in-progress: true` on main, two merges landing inside one CI
  # runtime meant the FIRST one never deployed at all. Measured 2026-08-11:
  # `bb419e0b` added migration `0005_fluffy_chronomancer`, its CI run
  # `31447000177` was cancelled 19s later by the next merge, and deploy runs
  # `31447285794`/`31447285764` reported `skipped`. The migration sat unapplied
  # behind two green pull requests until a later deploy's `pre` phase happened
  # to pick it up.
  #
  # It is usually self-healing — the next successful deploy applies everything
  # pending, and the scope diff runs from the `deployed/backend` marker rather
  # than from the previous commit — which is exactly what makes it dangerous:
  # the loss is invisible unless the cancelling commit's own CI then fails, or
  # it is the last merge for a while.
  #
  # An EXPRESSION, and the two ways of getting it wrong are not symmetric. A
  # mistype that evaluates falsy disables cancelling everywhere: slower PR CI,
  # main still protected — safe. A mistype in the BRANCH NAME (`refs/heads/mian`)
  # evaluates TRUE on main and silently restores the defect. That asymmetry is
  # why `deployWiring.test.ts` matches this expression exactly rather than
  # semantically.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUN_VERSION: '1.4.2'
  NODE_VERSION: '22.17.0'

jobs:
  # Pull requests run only the suites whose inputs they touch. Every other
  # event runs everything: on push to main the filter step is skipped and the
  # plan hands over every suite, so the deploy workflows (which gate on this
  # run's `success`) always follow a complete run.
  #
  # `shared` is everything more than one package reads — the lockfile, root
  # manifests and configs, the scripts `bun run check` runs, CI itself
  # (including test-suites.yml), and `contracts`, which every
  # other package builds against. Touching any of it runs everything. A path in
  # no filter (docs, say) runs only the jobs that are never filtered.
  changes:
    name: Detect affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lockfile: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.manifests == 'true' }}
      reviewer: ${{ github.event_name != 'pull_request' || steps.filter.outputs.shared == 'true' || steps.filter.outputs.reviewer == 'true' }}
      test-suites: ${{ steps.plan.outputs.suites }}
      tests-any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: .github
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            shared:
              - 'bun.lock'
              - 'bunfig.toml'
              - 'package.json'
              - 'tsconfig.json'
              - 'docker-compose.postgres.yml'
              - '.github/**'
              - 'scripts/**'
              - 'packages/contracts/**'
            manifests:
              - '**/package.json'
            backend:
              - 'packages/backend/**'
            core:
              - 'packages/core/**'
            reviewer:
              - 'packages/reviewer/**'
            console:
              - 'packages/console/**'
      # Drops the suites of untouched packages from the list, so an unaffected
      # suite is never started at all. Outside a pull request nothing is
      # dropped. The empty-list guard matters: `matrix.include: []` is an
      # error, so `tests-any` skips the job instead.
      - name: Plan the test matrix
        id: plan
        env:
          PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
          SHARED: ${{ steps.filter.outputs.shared }}
          BACKEND: ${{ steps.filter.outputs.backend }}
          CORE: ${{ steps.filter.outputs.core }}
          REVIEWER: ${{ steps.filter.outputs.reviewer }}
          CONSOLE: ${{ steps.filter.outputs.console }}
        run: |
          drop=()
          if [ "$PULL_REQUEST" = 'true' ] && [ "$SHARED" != 'true' ]; then
            drop+=(contracts)
            [ "$BACKEND" = 'true' ] || drop+=(backend)
            [ "$CORE" = 'true' ] || drop+=(core core-express core-testing core-outbox)
            [ "$REVIEWER" = 'true' ] || drop+=(reviewer)
            [ "$CONSOLE" = 'true' ] || drop+=(console)
          fi
          drop_json=$(printf '%s\n' "${drop[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          suites=$(yq -o=json '.suites' .github/test-suites.yml | jq -c --argjson drop "$drop_json" 'map(select(.package as $p | $drop | index($p) | not))')
          total=$(yq '.suites | length' .github/test-suites.yml)
          if [ "$total" -lt 1 ]; then
            echo "::error::.github/test-suites.yml lists no suites"
            exit 1
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
          echo "any=$([ "$(jq length <<<"$suites")" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Running: $(jq -c 'map(.package)' <<<"$suites") (dropped: $drop_json, of $total)"

  quality:
    name: Build, lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify Oxy dependency health
        run: bun run doctor:oxy
      # Formatting and lint for the WHOLE tree — src, tests and scripts alike —
      # in the read-only CI mode. `bun run lint` inside `check` runs it again
      # alongside the per-package tsc projects and the Expo env-var ESLint rules.
      - name: Check formatting and lint (Biome)
        run: bunx biome ci .
      - name: Verify workspace, build, lint and typecheck
        run: bun run check
      # The dist-orphan check is inside `bun run check` above, as `check:dist`, and
      # runs after the build for the reason that matters: it compares what the build
      # emitted against the source, and a stale dist/ file does not error, it ships.
      # `bun run lint` covering src only is how a broken test file passes lint.
      # This states what each package type-checks and fails if any test file falls
      # outside every checked project.
      - name: Verify every package type-checks its tests
        run: bun .github/scripts/assert-tests-typechecked.mjs
      - name: Verify release and CI safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh
          bash .github/scripts/test-cloudflare-worker.sh
          bun .github/scripts/test-runtime-image-audit.mjs
          bun .github/scripts/test-assert-test-floor.mjs
          bun scripts/test-check-lockfile-sync.mjs
          bun scripts/test-check-injection-sinks.mjs

  lockfile:
    name: Lockfile sync
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.lockfile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Its own job because it needs a plain install: `--frozen-lockfile` exits 0
      # on a lockfile that a plain install rewrites, so it cannot be this gate.
      # The script runs the install itself and hands the lockfile back unchanged.
      - name: Verify bun.lock was committed with its manifest change
        run: bun scripts/check-lockfile-sync.mjs

  tests:
    name: Test ${{ matrix.package }}
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.tests-any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # The suites live in .github/test-suites.yml, with the reasoning for
        # each entry; `changes` hands over the ones this run needs.
        include: ${{ fromJSON(needs.changes.outputs.test-suites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node test runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      # Each suite imports its workspace dependencies by package name, which
      # resolve to their BUILT dist/ — so a suite that reaches a sibling needs that
      # sibling built, not just contracts. Getting this wrong is invisible in a
      # warm local tree, where a stale dist/ from an earlier build satisfies the
      # import; only a clean checkout shows it.
      #
      # `contracts` is the only sibling any suite reaches now. The client, the
      # Express receiver, the outbox and the sandbox are one package and import
      # each other by RELATIVE path, so nothing among them resolves through a
      # `dist/` that a build step has to produce first.
      - name: Build the workspace dependencies this suite resolves
        run: ${{ matrix.build || 'bun run build:contracts' }}
      # `--wait` rather than a sleep: the compose file carries a `pg_isready`
      # healthcheck, and a suite that starts before the server is accepting
      # connections fails as a connection error rather than as a schema problem.
      - name: Start PostgreSQL
        if: matrix.postgres
        run: docker compose -f docker-compose.postgres.yml up -d --wait postgres
      - name: Run complete package test suite
        # The suite REFUSES to run without this (vitest.globalSetup.ts throws), so
        # a job that forgot it fails loudly instead of silently skipping the
        # schema tests — which is the whole reason the setup throws.
        env:
          CROWDSOURCE_APP_TEST_POSTGRES_URL: ${{ matrix.postgres && 'postgres://crowdsource:crowdsource@127.0.0.1:5436/postgres' || '' }}
          # A second variable naming the same server, rather than one shared
          # between the suites. Each resolves its own admin URL and names it
          # after itself — the same reasoning `@oxy.so/db/testing` gives for
          # having no environment default of its own — so the two can never end
          # up disagreeing about which of them is configured. Both create their
          # own throwaway database on this server and drop it again.
          #
          # `CROWDSOURCE_APP_TEST_POSTGRES_URL` keeps its name through the scope
          # rename deliberately. It is read by developers, by this workflow and
          # by `docker-compose.postgres.yml`'s documentation, and renaming a
          # variable buys nothing that a reader of `vitest.globalSetup.ts` does
          # not already get — while a stale export somewhere would make the
          # outbox suite refuse to start, loudly, for no reason.
          CROWDSOURCE_BACKEND_TEST_POSTGRES_URL: ${{ matrix.postgres && 'postgres://crowdsource:crowdsource@127.0.0.1:5436/postgres' || '' }}
        run: ${{ matrix.command }}
      # A suite that runs nothing exits 0. This states the count the runner
      # actually reached and refuses one below the floor, so a job cannot report
      # success while gating nothing.
      - name: Assert the suite actually ran
        if: matrix.minimum_tests
        run: >-
          bun .github/scripts/assert-test-floor.mjs
          "$RUNNER_TEMP/${{ matrix.package }}-tests.json"
          "${{ matrix.label || format('packages/{0}', matrix.package) }}"
          "${{ matrix.minimum_tests }}"
      - name: Upload coverage summary
        if: always() && matrix.coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crowdsource-${{ matrix.package }}-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.package }}-coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  reviewer-bundle:
    name: Reviewer bundle budget
    needs: changes
    if: >-
      !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.reviewer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # No Bun package cache, measured rather than assumed: on PR run
      # 36715028474 a cache HIT spent 6-13s restoring 263 MB and then 2s
      # installing, against 5-7s for a cold `bun install` in the runs before it.
      # Bun downloads faster than actions/cache restores.
      - name: Set up pinned Node bundle runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared contracts package
        run: bun run build:contracts
      - name: Export production web bundle
        run: bun run --cwd packages/reviewer build:analyze
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.crowdsource.oxy.so
      - name: Validate static hosting contract
        run: bun .github/scripts/validate-frontend-static-output.mjs packages/reviewer/dist
      - name: Enforce bundle budgets
        run: >-
          bun run --cwd packages/reviewer analyze-bundle --
          --ci
          --json "${{ runner.temp }}/crowdsource-bundle-report.json"
      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crowdsource-reviewer-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/crowdsource-bundle-report.json
          if-no-files-found: warn
          retention-days: 14
