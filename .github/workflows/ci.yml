name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.14'
  NODE_VERSION: '22.17.0'

jobs:
  quality:
    name: Build, lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify workspace, build, lint and typecheck
        run: bun run check
      - name: Verify release and CI safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh
          bash .github/scripts/test-assert-own-database.sh
          bash .github/scripts/test-cloudflare-pages.sh
          bun .github/scripts/test-runtime-image-audit.mjs
          bun .github/scripts/test-assert-test-floor.mjs
          bun scripts/test-check-lockfile-sync.mjs

  lockfile:
    name: Lockfile sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Its own job because it needs a plain install: `--frozen-lockfile` exits 0
      # on a lockfile that a plain install rewrites, so it cannot be this gate.
      # The script runs the install itself and hands the lockfile back unchanged.
      - name: Verify bun.lock was committed with its manifest change
        run: bun scripts/check-lockfile-sync.mjs

  tests:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            command: bun run --cwd packages/backend test:coverage -- --coverage.reportsDirectory="$RUNNER_TEMP/backend-coverage"
            coverage: true
          - package: reviewer
            command: bun run --cwd packages/reviewer test:coverage -- --coverageDirectory="$RUNNER_TEMP/reviewer-coverage"
            coverage: true
          # The four published packages. Every Oxy app is about to depend on them,
          # so an untested change here breaks adopters rather than us. The floor is
          # a minimum, not a target: a suite that runs nothing exits 0, and without
          # a stated count that job reads as coverage forever.
          - package: contracts
            command: bun run --cwd packages/contracts test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/contracts-tests.json"
            minimum_tests: 170
          - package: sdk
            command: bun run --cwd packages/sdk test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/sdk-tests.json"
            minimum_tests: 75
          - package: sdk-express
            command: bun run --cwd packages/sdk-express test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/sdk-express-tests.json"
            minimum_tests: 47
          - package: testing
            command: bun run --cwd packages/testing test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/testing-tests.json"
            minimum_tests: 13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node test runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared contracts package
        run: bun run build:contracts
      - name: Run complete package test suite
        run: ${{ matrix.command }}
      # A suite that runs nothing exits 0. This states the count the runner
      # actually reached and refuses one below the floor, so a job cannot report
      # success while gating nothing.
      - name: Assert the suite actually ran
        if: matrix.minimum_tests
        run: >-
          bun .github/scripts/assert-test-floor.mjs
          "$RUNNER_TEMP/${{ matrix.package }}-tests.json"
          "packages/${{ matrix.package }}"
          "${{ matrix.minimum_tests }}"
      - name: Upload coverage summary
        if: always() && matrix.coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crowdsource-${{ matrix.package }}-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.package }}-coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  reviewer-bundle:
    name: Reviewer bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node bundle runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared contracts package
        run: bun run build:contracts
      - name: Export production web bundle
        run: bun run --cwd packages/reviewer build:analyze
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.crowdsource.oxy.so
      - name: Validate static hosting contract
        run: bun .github/scripts/validate-frontend-static-output.mjs packages/reviewer/dist
      - name: Enforce bundle budgets
        run: >-
          bun run --cwd packages/reviewer analyze-bundle --
          --ci
          --json "${{ runner.temp }}/crowdsource-bundle-report.json"
      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crowdsource-reviewer-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/crowdsource-bundle-report.json
          if-no-files-found: warn
          retention-days: 14
