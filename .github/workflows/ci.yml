name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PULL REQUESTS CANCEL; MAIN NEVER DOES, and the second half is a deploy
  # invariant rather than a CI preference.
  #
  # `deploy-aws.yml` and `deploy-frontends.yml` both trigger on
  # `workflow_run … types: [completed]` and gate on
  # `workflow_run.conclusion == 'success'`. `completed` fires on ANY completion,
  # cancellation included — so a cancelled CI run starts the deploy workflow,
  # fails its scope job, and the run reports `skipped`. That is the same word a
  # legitimately path-filtered deploy uses, and nothing anywhere is red.
  #
  # With `cancel-in-progress: true` on main, two merges landing inside one CI
  # runtime meant the FIRST one never deployed at all. Measured 2026-08-11:
  # `bb419e0b` added migration `0005_fluffy_chronomancer`, its CI run
  # `31447000177` was cancelled 19s later by the next merge, and deploy runs
  # `31447285794`/`31447285764` reported `skipped`. The migration sat unapplied
  # behind two green pull requests until a later deploy's `pre` phase happened
  # to pick it up.
  #
  # It is usually self-healing — the next successful deploy applies everything
  # pending, and the scope diff runs from the `deployed/backend` marker rather
  # than from the previous commit — which is exactly what makes it dangerous:
  # the loss is invisible unless the cancelling commit's own CI then fails, or
  # it is the last merge for a while.
  #
  # An EXPRESSION, and the two ways of getting it wrong are not symmetric. A
  # mistype that evaluates falsy disables cancelling everywhere: slower PR CI,
  # main still protected — safe. A mistype in the BRANCH NAME (`refs/heads/mian`)
  # evaluates TRUE on main and silently restores the defect. That asymmetry is
  # why `deployWiring.test.ts` matches this expression exactly rather than
  # semantically.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  BUN_VERSION: '1.3.14'
  NODE_VERSION: '22.17.0'

jobs:
  quality:
    name: Build, lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Verify workspace, build, lint and typecheck
        run: bun run check
      # The dist-orphan check is inside `bun run check` above, as `check:dist`, and
      # runs after the build for the reason that matters: it compares what the build
      # emitted against the source, and a stale dist/ file does not error, it ships.
      # `bun run lint` covering src only is how a broken test file passes lint.
      # This states what each package type-checks and fails if any test file falls
      # outside every checked project.
      - name: Verify every package type-checks its tests
        run: bun .github/scripts/assert-tests-typechecked.mjs
      - name: Verify release and CI safeguards
        run: |
          bash -n .github/scripts/*.sh
          bash .github/scripts/test-deploy-ecs-image.sh
          bash .github/scripts/test-assert-own-database.sh
          bash .github/scripts/test-cloudflare-pages.sh
          bun .github/scripts/test-runtime-image-audit.mjs
          bun .github/scripts/test-assert-test-floor.mjs
          bun scripts/test-check-lockfile-sync.mjs
          bun scripts/test-check-injection-sinks.mjs

  lockfile:
    name: Lockfile sync
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Its own job because it needs a plain install: `--frozen-lockfile` exits 0
      # on a lockfile that a plain install rewrites, so it cannot be this gate.
      # The script runs the install itself and hands the lockfile back unchanged.
      - name: Verify bun.lock was committed with its manifest change
        run: bun scripts/check-lockfile-sync.mjs

  tests:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: backend
            command: bun run --cwd packages/backend test:coverage -- --coverage.reportsDirectory="$RUNNER_TEMP/backend-coverage"
            coverage: true
            # The tenant-isolation tests run against a REAL Postgres, and there is
            # no version of them that does not. Row-level security is a property of
            # the server: a mock cannot answer whether `FORCE` is set, whether a
            # superuser bypasses a policy, or whether `SET LOCAL` reverts at commit
            # — and each of those was measured, not assumed.
            #
            # It matters more here than for `app`, because the failure mode is
            # RETURNING ROWS rather than erroring. A suite that silently stopped
            # running these would be green, and production cannot contradict it:
            # the database holds two documents and neither carries a tenant pair.
            # `vitest.globalSetup.ts` therefore THROWS without the URL rather than
            # skipping, so a job that forgot this flag fails loudly.
            postgres: true
          - package: reviewer
            command: bun run --cwd packages/reviewer test:coverage -- --coverageDirectory="$RUNNER_TEMP/reviewer-coverage"
            coverage: true
          # The four published packages. Every Oxy app is about to depend on them,
          # so an untested change here breaks adopters rather than us. The floor is
          # a minimum, not a target: a suite that runs nothing exits 0, and without
          # a stated count that job reads as coverage forever.
          #
          # Sized to catch a COLLAPSE, not a single deleted test. One deletion is a
          # deliberate act a reviewer sees; a traversal breaking to near-zero is the
          # invisible failure. So these sit a few tests below current, and they move
          # DOWN when a suite legitimately shrinks — 0.3.0 removed the Uploads tests
          # and left sdk at 77, which had quietly narrowed its old floor of 75 to
          # two tests of slack.
          - package: contracts
            command: bun run --cwd packages/contracts test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/contracts-tests.json"
            # Raised with the appeals contracts (§9.8): the suite runs 201, and a
            # floor of 170 would let all 25 of those tests be deleted with the job
            # still green — which is the erosion this gate exists to catch.
            minimum_tests: 195
          - package: sdk
            command: bun run --cwd packages/sdk test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/sdk-tests.json"
            minimum_tests: 73
          - package: sdk-express
            command: bun run --cwd packages/sdk-express test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/sdk-express-tests.json"
            build: bun run build:contracts && bun run --cwd packages/sdk build && bun run --cwd packages/testing build
            minimum_tests: 47
          - package: testing
            command: bun run --cwd packages/testing test -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/testing-tests.json"
            build: bun run build:contracts && bun run --cwd packages/sdk build
            minimum_tests: 12
          # `test:unit` rather than `test`, because the package's own `test` chains
          # the invariant mutation run and the reporter flags below would land on
          # that script instead of on vitest. Both halves still run here: the
          # mutation script is what proves the two invariant tests can fail at all,
          # so a job that skipped it would gate nothing that matters.
          - package: app
            # `test:table-type` is listed explicitly rather than reached through the
            # package's own `test` script, because this command replaces it: a gate
            # chained into a script CI does not call is a gate that never runs, and
            # an absent check is indistinguishable from a passing one.
            command: bun run --cwd packages/app test:unit -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/app-tests.json" && bun run --cwd packages/app test:invariants && bun run --cwd packages/app test:table-type
            build: bun run build:contracts && bun run --cwd packages/sdk build && bun run --cwd packages/sdk-express build && bun run --cwd packages/testing build
            # The PostgreSQL-only suite runs 128 tests. This floor is sized to
            # catch a traversal/backend collapse rather than turn one reviewed
            # test deletion into an unrelated CI edit.
            minimum_tests: 124
            # The schema and store tests run against a REAL Postgres: a fake
            # cannot answer a `pg_index` query, and the questions that matter here
            # (is the swept column indexed, does the composite primary key exist,
            # does SKIP LOCKED skip) are catalogue and concurrency questions.
            #
            # Started from the SAME compose file a developer uses, deliberately,
            # rather than from a `services:` block. A `services:` block is
            # job-level and cannot be conditional on a matrix value, so it would
            # start a container for all nine entries including the two frontends —
            # and it would restate the image pin, giving CI and a developer two
            # places to disagree about the version under test.
            postgres: true
          # The console has no coverage threshold of its own yet, so it runs the plain
          # suite: a `coverage: true` entry whose package publishes no summary would fail
          # the upload step below with `if-no-files-found: error`, which is a CI failure
          # about an artifact rather than about the code.
          - package: console
            command: bun run --cwd packages/console test
            coverage: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node test runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      # Each suite imports its workspace dependencies by package name, which
      # resolve to their BUILT dist/ — so a suite that reaches a sibling needs that
      # sibling built, not just contracts. Getting this wrong is invisible in a
      # warm local tree, where a stale dist/ from an earlier build satisfies the
      # import; only a clean checkout shows it.
      - name: Build the workspace dependencies this suite resolves
        run: ${{ matrix.build || 'bun run build:contracts' }}
      # `--wait` rather than a sleep: the compose file carries a `pg_isready`
      # healthcheck, and a suite that starts before the server is accepting
      # connections fails as a connection error rather than as a schema problem.
      - name: Start PostgreSQL
        if: matrix.postgres
        run: docker compose -f docker-compose.postgres.yml up -d --wait postgres
      - name: Run complete package test suite
        # The suite REFUSES to run without this (vitest.globalSetup.ts throws), so
        # a job that forgot it fails loudly instead of silently skipping the
        # schema tests — which is the whole reason the setup throws.
        env:
          CROWDSOURCE_APP_TEST_POSTGRES_URL: ${{ matrix.postgres && 'postgres://crowdsource:crowdsource@127.0.0.1:5436/postgres' || '' }}
          # A second variable naming the same server, rather than one shared
          # between the packages. Each package resolves its own admin URL and
          # names it after itself — the same reasoning `@oxyhq/db/testing` gives
          # for having no environment default of its own — so the two suites can
          # never end up disagreeing about which of them is configured. Both
          # create their own throwaway database on this server and drop it again.
          CROWDSOURCE_BACKEND_TEST_POSTGRES_URL: ${{ matrix.postgres && 'postgres://crowdsource:crowdsource@127.0.0.1:5436/postgres' || '' }}
        run: ${{ matrix.command }}
      # A suite that runs nothing exits 0. This states the count the runner
      # actually reached and refuses one below the floor, so a job cannot report
      # success while gating nothing.
      - name: Assert the suite actually ran
        if: matrix.minimum_tests
        run: >-
          bun .github/scripts/assert-test-floor.mjs
          "$RUNNER_TEMP/${{ matrix.package }}-tests.json"
          "packages/${{ matrix.package }}"
          "${{ matrix.minimum_tests }}"
      - name: Upload coverage summary
        if: always() && matrix.coverage
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crowdsource-${{ matrix.package }}-coverage-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.package }}-coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 14

  reviewer-bundle:
    name: Reviewer bundle budget
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Set up pinned Node bundle runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install exact dependency graph
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build shared contracts package
        run: bun run build:contracts
      - name: Export production web bundle
        run: bun run --cwd packages/reviewer build:analyze
        env:
          NODE_ENV: production
          EXPO_PUBLIC_ENV: production
          EXPO_PUBLIC_API_URL: https://api.crowdsource.oxy.so
      - name: Validate static hosting contract
        run: bun .github/scripts/validate-frontend-static-output.mjs packages/reviewer/dist
      - name: Enforce bundle budgets
        run: >-
          bun run --cwd packages/reviewer analyze-bundle --
          --ci
          --json "${{ runner.temp }}/crowdsource-bundle-report.json"
      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: crowdsource-reviewer-bundle-${{ github.sha }}
          path: ${{ runner.temp }}/crowdsource-bundle-report.json
          if-no-files-found: warn
          retention-days: 14
