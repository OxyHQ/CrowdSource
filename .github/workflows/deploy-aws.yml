name: Deploy CrowdSource Backend to AWS

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-crowdsource-backend
  # Serialize production rollouts. Cancelling after `update-service` would leave
  # an unmonitored deployment running in ECS.
  cancel-in-progress: false

env:
  AWS_REGION: us-west-2
  AWS_ACCOUNT_ID: '237343248947'
  ECR_REGISTRY: 237343248947.dkr.ecr.us-west-2.amazonaws.com
  APP: crowdsource
  CONTAINER_NAME: crowdsource
  CLUSTER: oxy-cluster
  DOCKERFILE: packages/backend/Dockerfile
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  scope:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # The scope diff runs from the `deployed/backend` marker to the
          # candidate, so this job needs the marker tags and the history that
          # connects them to the candidate.
          fetch-depth: 0
          fetch-tags: true
      - name: Detect backend deployment scope
        id: filter
        run: bash .github/scripts/deployment-scope.sh backend

  deploy:
    needs: scope
    if: needs.scope.outputs.deploy == 'true'
    runs-on: ubuntu-24.04-arm
    # Includes image build, migrations, rollout, smoke checks and a full
    # rollback window if the production smoke check fails.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 2

      - name: Verify current main before building
        run: bash .github/scripts/require-current-main.sh

      # Runs before any AWS credential is issued. The database this release is
      # allowed to reach is declared in application source, so this is the
      # earliest point the target can be checked — long before a task starts.
      - name: Verify this release targets its own database
        run: bash .github/scripts/assert-own-database.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: arn:aws:iam::237343248947:role/oxy-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push immutable backend image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: linux/arm64
          push: true
          # The SHA tag is the release record. `latest` is published alongside
          # it because the Terraform task definition references
          # oxy/crowdsource:latest — on a new repository that tag does not
          # exist, so the service cannot pull an image after `terraform apply`
          # until something publishes it. Neither tag is what a deploy resolves:
          # every consumer below pins steps.build.outputs.digest.
          tags: |
            ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}:${{ env.DEPLOY_SHA }}
            ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}:latest
          cache-from: type=gha,scope=crowdsource-backend
          cache-to: type=gha,mode=max,scope=crowdsource-backend
          provenance: true
          sbom: true

      - name: Audit final backend runtime image
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          EXPECTED_RUNTIME_ENTRY: packages/backend/dist/server.js
          # The workspace scope the repository actually publishes into the image
          # (packages/backend/package.json, and the `--filter` arguments in
          # packages/backend/Dockerfile). The audit fails in both directions, so
          # this must track the manifests, not the product name.
          EXPECTED_WORKSPACE_PACKAGES: '@crowdsource/backend,@oxyhq/crowdsource-contracts'
        run: bash .github/scripts/audit-runtime-image.sh

      - name: Verify current main before production changes
        run: bash .github/scripts/require-current-main.sh

      - name: Sync GitHub secrets to SSM
        env:
          # Only what the service actually reads (packages/backend/src/config).
          # A parameter nothing consumes is a secret with no owner: it never
          # rotates, and nothing fails when it goes stale. Each module adds its
          # own here as it ships — REDIS_URL arrives with the first BullMQ queue,
          # and it will need the shared-Valkey database-index guard back.
          # The key webhook signing secrets are encrypted with at rest (§13.4).
          # Without it the two webhook-management routes answer 503 and no
          # endpoint can be registered — the service still boots, deliberately,
          # so that adding this variable could not take production down on the
          # deploy that introduced it.
          WEBHOOK_SECRET_ENCRYPTION_KEY: ${{ secrets.WEBHOOK_SECRET_ENCRYPTION_KEY }}
          SSM_SECRET_ALLOWLIST: WEBHOOK_SECRET_ENCRYPTION_KEY
        run: |
          set -euo pipefail

          is_set() {
            local value="${1:-}"
            [[ -n "$value" && "$value" != "-" ]]
          }

          # Every parameter written here is namespaced under /oxy/crowdsource/.
          # This app never writes the shared parameter namespace, which backs
          # every Oxy backend at once.
          for key in $SSM_SECRET_ALLOWLIST; do
            value="${!key:-}"
            if ! is_set "$value"; then
              echo "::warning::Skipping empty or placeholder secret $key; SSM unchanged."
              continue
            fi

            # MONGODB_URI is no longer synced (the shared instance was retired
            # on 2026-08-10 — oxy-infra runbook 31), so the note that used to sit
            # here about not checking its database component no longer applies.
            # assert-own-database.sh still runs above against source; it guards a
            # shared-instance hazard that no longer exists and is left for the
            # Postgres port to retire deliberately rather than as a side effect.
            aws ssm put-parameter \
              --name "/oxy/$APP/$key" \
              --value "$value" \
              --type SecureString \
              --overwrite \
              >/dev/null
            echo "Synced /oxy/$APP/$key"
          done

      - name: Re-verify current main before ECS rollout
        run: bash .github/scripts/require-current-main.sh

      - name: Register immutable task definition and deploy
        env:
          IMAGE_URI: ${{ env.ECR_REGISTRY }}/oxy/${{ env.APP }}@${{ steps.build.outputs.digest }}
          # The migration runner now EXISTS — `packages/backend/dist/scripts/
          # migrate.js`, emitted from `scripts/migrate.ts` — and
          # `deploy-ecs-image.sh` knows how to run it: it registers a revision
          # of the MIGRATION family carrying this release's image, applies
          # `--phase=pre` before the rollout and `--phase=post` after the smoke
          # check, and refuses outright if the family, the target database or
          # the migrator credential is missing.
          #
          # What still gates RUN_MIGRATIONS is INFRASTRUCTURE: the database is
          # not provisioned and `oxy-crowdsource-migrate` does not exist yet.
          # Turn this on in the SAME change that lands them, together with the
          # variables below — the script fails closed without them, so a
          # half-configured flip stops the deploy rather than migrating as the
          # wrong role.
          #
          # `oxy-crowdsource-migrate` carries MIGRATOR_DATABASE_URL and nothing
          # else. Its own image is whatever revision 1 was registered with; the
          # release replaces it with this build's digest before running, which
          # is why the migrations applied are always the ones being deployed.
          RUN_MIGRATIONS: 'true'
          MIGRATION_TASK_DEFINITION_FAMILY: oxy-crowdsource-migrate
          MIGRATION_TARGET_DATABASE: crowdsource
          MIGRATION_COMMAND_JSON: >-
            ["bun","packages/backend/dist/scripts/migrate.js"]
          POST_DEPLOY_SMOKE_SCRIPT: .github/scripts/smoke-crowdsource.sh
          # Syncing a parameter to SSM does not put it in the container: the
          # task definition has to name it. A secret in the allow-list above
          # with no entry here reaches SSM and nothing else.
          #
          # DATABASE_URL is named here and is deliberately NOT in that
          # allow-list, which is not an oversight — it is how the parameter is
          # managed. `/oxy/crowdsource/DATABASE_URL` is a hand-written
          # SecureString (Alia's shape); there is no GitHub secret behind it,
          # and there must not be one. An allow-list entry would declare that CI
          # owns the value, so the day somebody creates a `DATABASE_URL` secret
          # — a placeholder, a stale copy, the migrator's string — the next
          # deploy would overwrite the credential the service cannot boot
          # without. The relationship the workflow can enforce is therefore
          # one-way: SYNCED IMPLIES NAMED, never the converse.
          # `deployWiring.test.ts` pins exactly that implication.
          #
          # MIGRATOR_DATABASE_URL must NEVER appear here. It names
          # crowdsource_migrator, which OWNS every table — and a table's owner
          # is exempt from its own row-security policies and can DROP POLICY in
          # one statement. The whole tenant boundary rests on the serving
          # container holding only crowdsource_app, which owns nothing. It lives
          # on `oxy-crowdsource-migrate` instead, which nothing serves traffic
          # from, and `deployWiring.test.ts` fails the build if it appears here.
          TASK_SECRET_OVERRIDES_JSON: >-
            {"WEBHOOK_SECRET_ENCRYPTION_KEY":
            "arn:aws:ssm:us-west-2:237343248947:parameter/oxy/crowdsource/WEBHOOK_SECRET_ENCRYPTION_KEY",
            "DATABASE_URL":
            "arn:aws:ssm:us-west-2:237343248947:parameter/oxy/crowdsource/DATABASE_URL"}
        # ELB mutations belong in oxy-infra because the deploy role
        # intentionally lacks ELB access; the target group's health check path
        # is owned there.
        run: bash .github/scripts/deploy-ecs-image.sh

  record-deployment:
    # Runs only after a green production rollout, so a failed or rolled back
    # release stays inside the next candidate's scope diff.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only job in this workflow that may move the marker; the deploy job
    # keeps a read-only token and no AWS job may hold one.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          fetch-depth: 1

      - name: Record the deployed backend revision
        run: bash .github/scripts/record-deployment.sh backend
