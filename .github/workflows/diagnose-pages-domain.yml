name: Diagnose Pages domain

# Temporary diagnostic. The custom domain was attached to the Pages project but
# no DNS record appeared for it, and every locally stored Cloudflare credential
# is revoked, so the only place that can ask Cloudflare why is CI.
#
# Reads only. Prints named fields, never a whole response body and never a
# secret — this repository is public and its Actions logs are world-readable.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Cloudflare about the custom domain
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail

          api() {
            curl -sS -X GET "https://api.cloudflare.com/client/v4/$1" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json'
          }

          echo '--- token permissions ---'
          api 'user/tokens/verify' | jq -r '{success, status: .result.status, errors: [.errors[]?.message]}'

          echo '--- pages custom domains ---'
          api "accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/crowdsource-frontend/domains" \
            | jq -r '{success, errors: [.errors[]?.message],
                      domains: [.result[]? | {name, status, verification_data: .verification_data?.status,
                                              validation_data: .validation_data?.status}]}'

          echo '--- can this token see the oxy.so zone? ---'
          api 'zones?name=oxy.so' \
            | jq -r '{success, errors: [.errors[]?.message], zones: [.result[]? | {name, id_present: (.id != null)}]}'

          echo '--- is there a DNS record for the apex label? ---'
          zone_id=$(api 'zones?name=oxy.so' | jq -r '.result[0].id // empty')
          if [ -z "$zone_id" ]; then
            echo 'No zone id readable with this token; DNS records cannot be inspected.'
          else
            api "zones/${zone_id}/dns_records?name=crowdsource.oxy.so" \
              | jq -r '{success, errors: [.errors[]?.message],
                        records: [.result[]? | {type, name, proxied, content_present: (.content != null)}]}'
          fi
